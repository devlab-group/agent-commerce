[profile.default]
src = "src"
out = "out"
# lib/forge-std is a vendored copy, not a git submodule, so a plain clone or a
# tarball builds without a second fetch. There is no `foundry.lock`: forge
# derives it from `.gitmodules`, and without a submodule it would report a
# spurious revision mismatch on every run. Add one only together with a real
# submodule.
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
