# ---------------------------------------------------------------------------
# Example: base-mainnet-payai - REAL FUNDS, unauthenticated facilitator
#
# Settles through PayAI's public facilitator without a credential, which PayAI
# accepts only within a free allowance. README.md in this directory covers the
# limits and links PayAI's pricing guide.
#
# Check the facilitator's current network and scheme support before use:
#   node -e "fetch('https://facilitator.payai.network/supported').then(r=>r.json())
#     .then(d=>console.log(d.kinds.filter(k=>k.network==='eip155:8453')))"
#
#   ALLOW_X402_MAINNET=true MERCHANT_WALLET=0x... \
#   npm run agent-commerce -- validate --config examples/base-mainnet-payai/config.yaml
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: base-mainnet-payai-example
  name: Base Mainnet (PayAI) Example
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}

server:
  port: ${GATEWAY_PORT:-8080}
  host: 0.0.0.0
  allowedOrigins: []

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp

resources:
  premium_report:
    name: Premium Report
    description: One paid endpoint, settled in USDC on Base.
    input:
      type: object
      properties: {}
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/api/report
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01"
      currency: USDC
    expose: [http, mcp]
    payments: [x402]

payments:
  x402:
    enabled: true

    network: eip155:8453
    rpcUrl: ${X402_RPC_URL:-https://base.drpc.org}

    # USDC on Base. A mainnet config may name no other asset
    asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    # The EIP-712 domain name the mainnet contract reports. Not "USDC": that
    # deployment predates the rename. Config load refuses any other name, which
    # would otherwise fail every payment after the buyer signed.
    assetName: "USD Coin"
    assetVersion: "2"
    assetDecimals: 6

    # Your wallet. Address only: the gateway never takes a merchant key
    payTo: ${MERCHANT_WALLET}

    maxTimeoutSeconds: 600

    # required, and required to be `true`. Mainnet is never a default
    allowMainnet: ${ALLOW_X402_MAINNET}

    # A separate decision from allowMainnet: every payment authorization goes
    # to PayAI without credentials. The signed authorization fixes its
    # recipient, amount and chain, but PayAI sees each one and applies its own
    # limits.
    allowUnauthenticatedFacilitator: true

    facilitator:
      mode: remote
      url: https://facilitator.payai.network
      auth:
        type: none
