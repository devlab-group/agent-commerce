# ---------------------------------------------------------------------------
# Example: base-mainnet - REAL FUNDS
#
# Required settings are checked at config load; `agent-commerce validate`
# reports missing environment variables. The port, receipt path, and RPC URL
# have defaults; no other variable does.
#
# The gateway holds no on-chain signing key here. It does hold the configured
# facilitator credential. Mainnet requires a remote facilitator because local
# mode would put a funded gas signer in this process. Buyer funds move directly
# to the merchant on-chain.
#
#   ALLOW_X402_MAINNET=true MERCHANT_WALLET=0x... X402_FACILITATOR_URL=... \
#   CDP_API_KEY_ID=... CDP_API_KEY_SECRET=... GATEWAY_PUBLIC_BASE_URL=... \
#   ADMIN_TOKEN=... MERCHANT_API_BASE_URL=... \
#   npm run agent-commerce -- validate --config examples/base-mainnet/config.yaml
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: base-mainnet-example
  name: Base Mainnet Example
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL}

server:
  port: ${GATEWAY_PORT:-8080}
  host: 0.0.0.0
  # Required here: operator routes carry the commerce ledger (payer addresses,
  # amounts, settlement hashes). With no adminToken at all they 404, which is
  # safe but leaves you unable to read your own receipts over HTTP.
  adminToken: ${ADMIN_TOKEN}
  allowedOrigins: []

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp

resources:
  premium_report:
    name: Premium Report
    description: One paid endpoint, settled in USDC on Base.
    input:
      type: object
      properties: {}
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL}/api/report
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01"
      currency: USDC
    expose: [http, mcp]
    payments: [x402]

payments:
  x402:
    enabled: true

    # required. Base mainnet
    network: eip155:8453

    # Health checks only; the facilitator does the chain work.
    # A dedicated endpoint is strongly preferred here; the public one is rate
    # limited and its outages become your readiness failures.
    rpcUrl: ${X402_RPC_URL:-https://base.drpc.org}

    # required, and checked: a mainnet config may only name USDC on Base.
    # Settling a mainnet payment in an unintended token is refused.
    asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    # The EIP-712 domain name the mainnet contract reports. Not "USDC": that
    # deployment predates the rename. Config load refuses any other name, which
    # would otherwise fail every payment after the buyer signed.
    assetName: "USD Coin"
    assetVersion: "2"
    assetDecimals: 6

    # required. Your wallet. Never a gateway-owned one, and never a
    # development address: startup refuses a well-known Anvil account here.
    payTo: ${MERCHANT_WALLET}

    # Public-chain block times and a hosted facilitator's queue are not yours
    # to control. Short windows here become failed payments.
    maxTimeoutSeconds: 600

    # required, and required to be `true`. Mainnet is never a default
    allowMainnet: ${ALLOW_X402_MAINNET}

    facilitator:
      # required. `local` is refused on mainnet
      mode: remote
      # required, and must be https
      url: ${X402_FACILITATOR_URL}
      # required to be something other than `none` on mainnet, unless
      # allowUnauthenticatedFacilitator is set (see examples/base-mainnet-payai)
      #
      # `cdp` needs the optional peer @coinbase/x402, which signs a fresh JWT
      # per request. For any facilitator that takes a static token, use:
      #   auth:
      #     type: bearer
      #     token: ${X402_FACILITATOR_TOKEN}
      auth:
        type: cdp
        apiKeyId: ${CDP_API_KEY_ID}
        apiKeySecret: ${CDP_API_KEY_SECRET}
