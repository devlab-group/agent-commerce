# ---------------------------------------------------------------------------
# Example: near-testnet
#
# x402 `exact` on NEAR testnet. The buyer signs a NEP-366 delegate action
# holding one `ft_transfer`, and the facilitator's relayer submits it and pays
# the gas, so neither the gateway nor the merchant holds a key. Needs the
# optional peer @x402/near and a facilitator serving near:testnet.
# X402_FACILITATOR_URL has no default.
#
#   NEAR_MERCHANT_ACCOUNT=merchant.testnet X402_FACILITATOR_URL=https://... \
#   npm run agent-commerce -- validate --config examples/near-testnet/config.yaml
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: near-testnet-example
  name: NEAR Testnet Example
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}

server:
  port: ${GATEWAY_PORT:-8080}
  host: 0.0.0.0
  # Operator routes (receipts, events) 404 without this. Uncomment and set it
  # before exposing the gateway anywhere.
  # adminToken: ${ADMIN_TOKEN}

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp

resources:
  premium_report:
    name: Premium Report
    description: One paid endpoint, settled in USDC on NEAR testnet.
    input:
      type: object
      properties: {}
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/api/report
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01"
      currency: USDC
    expose: [http, mcp]
    payments: [x402]

payments:
  x402:
    enabled: true
    network: near:testnet
    # No asset fields: the testnet USDC token account, from the built-in profile.
    # This account must hold a storage deposit with that token (NEP-145).
    payTo: ${NEAR_MERCHANT_ACCOUNT}
    networks:
      # Only for health checks: chain id, token code and decimals, storage
      near:testnet:
        rpcUrl: ${X402_RPC_URL:-https://rpc.testnet.fastnear.com}
    maxTimeoutSeconds: 300
    facilitator:
      mode: remote
      url: ${X402_FACILITATOR_URL}
      auth:
        type: none
