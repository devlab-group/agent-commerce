# ---------------------------------------------------------------------------
# Example: acp-checkout
#
# The Agentic Commerce Protocol (ACP) checkout service, stable snapshot
# 2026-04-17 — experimental. Five ACP operations, each mapped to one canonical
# resource that fronts the merchant's own checkout API.
#
# Every `${VAR:-default}` falls back to the local demo stack's own defaults, so
# this file validates standalone with no environment at all:
# npm run agent-commerce -- validate --config examples/acp-checkout/config.yaml
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: acp-checkout-example
  name: ACP Checkout Example
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}

server:
  port: ${GATEWAY_PORT:-8080}
  host: 0.0.0.0

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  # Off: this gateway serves ACP, not generic HTTP resource routes.
  http:
    enabled: false
  mcp:
    enabled: false
    mountPath: /mcp
  acp:
    enabled: true
    mountPath: /acp
    auth:
      # Bearer is the only scheme in this release, and every checkout route
      # requires it. Discovery stays public.
      type: bearer
      token: ${ACP_BEARER_TOKEN:-local-development-acp-token}
    idempotency:
      # Its own database: ACP checkout replay has nothing to do with x402
      # payment replay, and the two must not share a table.
      path: ${ACP_IDEMPOTENCY_PATH:-./data/acp-idempotency.sqlite}
      # ACP's retry window. 24 is both the default and the floor.
      retentionHours: 24
    checkout:
      # All five operations, each on its own resource. A partially mapped
      # lifecycle is refused at load: discovery advertises `checkout` as one
      # service, so a seller announcing it must be able to serve all of it.
      operations:
        createCheckoutSession: acp_checkout_create
        updateCheckoutSession: acp_checkout_update
        getCheckoutSession: acp_checkout_get
        completeCheckoutSession: acp_checkout_complete
        cancelCheckoutSession: acp_checkout_cancel
    # Optional, and omitted from /.well-known/acp.json when absent. Never
    # guessed, and never inferred from an x402 payment configuration - the
    # merchant's checkout currency is a different payment domain.
    discovery:
      supportedCurrencies: [usd]
      supportedLocales: [en-US]

# Every ACP checkout resource is `free` with no `payments`: ACP checkout carries
# the merchant's own purchase payment in `payment_data`, and charging an x402
# payment to *invoke* the operation would put two unrelated payment layers on
# one call. Config refuses a paid mapping.
#
# `inputBindings` maps the canonical ACP envelope onto the merchant request:
# `path` carries `{ checkout_session_id }`, `body` carries the ACP document.
resources:
  acp_checkout_create:
    name: Create checkout session
    description: ACP createCheckoutSession. Answers 201 with a checkout session.
    input:
      type: object
      properties:
        body: { type: object }
      required: [body]
      additionalProperties: false
    backend:
      type: http
      method: POST
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/checkout_sessions
      inputBindings:
        body: body
      timeoutMs: 10000
    pricing:
      type: free
    expose: [acp]

  acp_checkout_update:
    name: Update checkout session
    description: ACP updateCheckoutSession.
    input:
      type: object
      properties:
        path:
          type: object
          properties:
            checkout_session_id: { type: string }
          required: [checkout_session_id]
          additionalProperties: false
        body: { type: object }
      required: [path]
      additionalProperties: false
    backend:
      type: http
      method: POST
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/checkout_sessions/{checkout_session_id}
      inputBindings:
        path: path
        body: body
      timeoutMs: 10000
    pricing:
      type: free
    expose: [acp]

  acp_checkout_get:
    name: Retrieve checkout session
    description: ACP getCheckoutSession.
    input:
      type: object
      properties:
        path:
          type: object
          properties:
            checkout_session_id: { type: string }
          required: [checkout_session_id]
          additionalProperties: false
      required: [path]
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/checkout_sessions/{checkout_session_id}
      inputBindings:
        path: path
      timeoutMs: 10000
    pricing:
      type: free
    expose: [acp]

  acp_checkout_complete:
    name: Complete checkout session
    description: ACP completeCheckoutSession. `payment_data` reaches the backend as ordinary business input.
    input:
      type: object
      properties:
        path:
          type: object
          properties:
            checkout_session_id: { type: string }
          required: [checkout_session_id]
          additionalProperties: false
        body: { type: object }
      required: [path]
      additionalProperties: false
    backend:
      type: http
      method: POST
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/checkout_sessions/{checkout_session_id}/complete
      inputBindings:
        path: path
        body: body
      timeoutMs: 15000
    pricing:
      type: free
    expose: [acp]

  acp_checkout_cancel:
    name: Cancel checkout session
    description: ACP cancelCheckoutSession.
    input:
      type: object
      properties:
        path:
          type: object
          properties:
            checkout_session_id: { type: string }
          required: [checkout_session_id]
          additionalProperties: false
        body: { type: object }
      required: [path]
      additionalProperties: false
    backend:
      type: http
      method: POST
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/checkout_sessions/{checkout_session_id}/cancel
      inputBindings:
        path: path
        body: body
      timeoutMs: 10000
    pricing:
      type: free
    expose: [acp]

payments: {}
