# ---------------------------------------------------------------------------
# Example: solana-devnet
#
# x402 `exact` on Solana devnet. The buyer signs a token transfer, and the
# facilitator adds its fee payer signature and broadcasts it, so neither the
# gateway nor the merchant holds a key. Needs the optional peers @x402/svm and
# @solana/kit.
#
#   SOLANA_MERCHANT_WALLET=... \
#   npm run agent-commerce -- validate --config examples/solana-devnet/config.yaml
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: solana-devnet-example
  name: Solana Devnet Example
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}

server:
  port: ${GATEWAY_PORT:-8080}
  host: 0.0.0.0
  # Operator routes (receipts, events) 404 without this. Uncomment and set it
  # before exposing the gateway anywhere.
  # adminToken: ${ADMIN_TOKEN}

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp

resources:
  premium_report:
    name: Premium Report
    description: One paid endpoint, settled in USDC on Solana devnet.
    input:
      type: object
      properties: {}
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/api/report
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01"
      currency: USDC
    expose: [http, mcp]
    payments: [x402]

payments:
  x402:
    enabled: true
    network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
    # No asset fields: Circle's devnet USDC mint, from the built-in profile.
    # The transfer goes to this wallet's USDC token account, which must exist.
    payTo: ${SOLANA_MERCHANT_WALLET}
    networks:
      # Only for health checks: the genesis hash, the mint and its decimals
      solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1:
        rpcUrl: ${X402_RPC_URL:-https://api.devnet.solana.com}
    # A blockhash expires in about 60 to 90 seconds; a slower backend should
    # use `paymentFlow: upfront`
    maxTimeoutSeconds: 300
    facilitator:
      mode: remote
      # Its /supported names the fee payer each challenge carries
      url: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      auth:
        type: none
