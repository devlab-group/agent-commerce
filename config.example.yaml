# ---------------------------------------------------------------------------
# Agent Commerce Gateway — example configuration
#
# Copy to `config.yaml` and edit, or generate one with:
# npm run agent-commerce -- init
#
# Validate it with:
# npm run agent-commerce -- validate
#
# `${VAR}` placeholders are resolved from the environment at load time.
# Unresolved placeholders fail startup and are never printed.
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: demo-store
  name: Demo Data Store
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL}

server:
  port: ${GATEWAY_PORT}
  host: 0.0.0.0

  # Required to serve the operator routes (/api/receipts, /api/events,
  # /api/events/stream). If unset they return 404 rather than serving the
  # merchant's commerce ledger openly. Use a real secret in any deployment
  # reachable by anyone else.
  adminToken: ${ADMIN_TOKEN}

  # Browser origins permitted to read the gateway. Empty (the default) means
  # none. Agent traffic needs no entry here.
  allowedOrigins:
    - ${DASHBOARD_ORIGIN}

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp
  # A2A (Agent2Agent) is experimental and off by default. When enabled the
  # adapter also serves the spec-fixed /.well-known/agent-card.json.
  a2a:
    enabled: false
    mountPath: /a2a

resources:
  # --- free resource: proves the gateway fronts an existing API -------------
  weather_basic:
    name: Basic Weather
    description: Current basic weather for a city. Free.
    input:
      type: object
      properties:
        city:
          type: string
          description: City name, e.g. "Berlin"
      required: [city]
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL}/api/weather/{city}
      timeoutMs: 5000
    pricing:
      type: free
    expose: [http, mcp]

  # --- paid resource: proves x402 enforcement -------------------------------
  market_report:
    name: Premium Market Report
    description: Latest premium market analysis. Paid resource.
    input:
      type: object
      properties: {}
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL}/api/report
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01"
      currency: USDC
    expose: [http, mcp]
    payments: [x402]

payments:
  x402:
    enabled: true
    network: ${X402_NETWORK}
    rpcUrl: ${X402_RPC_URL}
    asset: ${X402_ASSET}
    assetName: ${X402_ASSET_NAME}
    assetVersion: ${X402_ASSET_VERSION}
    assetDecimals: ${X402_ASSET_DECIMALS}
    # Merchant-controlled settlement destination.
    # This is NEVER a gateway-owned wallet — see docs/security.md.
    payTo: ${MERCHANT_WALLET}
    # Seconds a payment challenge stays valid.
    maxTimeoutSeconds: 120
    # Who verifies the authorisation and broadcasts the transfer.
    #
    # mode: local   the facilitator runs in this process and signs with
    #               signerPrivateKey. Deterministic dev chain only — the key
    #               must be an Anvil well-known one, and startup refuses it
    #               against anything that is not a local/private RPC.
    #
    # mode: remote  an HTTP facilitator does the signing; this gateway holds no
    #               key at all. Requires https on any public host, and a
    #               credential on a mainnet.
    facilitator:
      mode: local
      signerPrivateKey: ${X402_FACILITATOR_PRIVATE_KEY}
    #
    # A public testnet instead — no key anywhere in this file:
    #
    # network: eip155:84532
    # facilitator:
    #   mode: remote
    #   url: https://x402.org/facilitator
    #   auth:
    #     type: none
    #
    # Base mainnet. Every line below is required; none of them are defaults:
    #
    # network: eip155:8453
    # asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC on Base
    # allowMainnet: true
    # facilitator:
    #   mode: remote
    #   url: ${X402_FACILITATOR_URL}
    #   auth:
    #     type: bearer
    #     token: ${X402_FACILITATOR_TOKEN}
