name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Release calls these same jobs before publishing. `needs` cannot depend on
  # jobs in a separate workflow.
  workflow_call:

# These jobs need read access only. Each checkout also disables persisted
# credentials so later steps cannot read the workflow token from `.git/config`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Keep this version in sync with the Foundry image digest in
  # docker/chain.Dockerfile. A floating `nightly` would change test inputs.
  FOUNDRY_VERSION: 'v1.7.1'

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Compare exported public types with the checked-in contract baseline.
      - run: npm run check:contract
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The local-chain tests start Anvil. Without Foundry they skip locally
      # but fail in CI.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  contracts:
    name: Solidity contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  e2e:
    name: Deterministic E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      # These tests start local Anvil, deploy MockUSDC and run local services;
      # they do not need a public RPC or hosted facilitator.
      - run: npm run test:e2e

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Check repository, bug-report and homepage URLs before packaging so
      # npm's vulnerability-report link points to this repository.
      - name: Verify package provenance metadata
        run: node scripts/check-package-metadata.mjs

      - run: npm run build
      # Exercise the built CLI separately from tests that run source files.
      - run: npm run test:cli:dist
      - run: npx vitest run tests/unit/cli/packaging.test.ts
      # Install the tarball outside the repository. First check the CLI and
      # `createGateway` without optional peers. A stray `viem` import can break
      # startup even when in-repo tests pass because peers are installed here.
      # Then install peers and check that the subpaths work with the main entry.
      - name: Install package without optional peers
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          mkdir -p "$RUNNER_TEMP/bare" && cd "$RUNNER_TEMP/bare"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          # Read peers from the manifest so newly declared peers are checked
          for peer in $(node -p "Object.keys(require('$GITHUB_WORKSPACE/package.json').peerDependencies).join(' ')"); do
            if [ -d "node_modules/$peer" ]; then
              echo "optional peer $peer was installed by default, so the split is not working"
              exit 1
            fi
          done
          npx agent-commerce --help
          npx agent-commerce --version
          npx agent-commerce version | grep -q '@modelcontextprotocol/server'
          npx agent-commerce init --yes
          npx agent-commerce validate
          # The main entry must compose and serve without optional peers
          node --input-type=module -e "
            import { createGateway, loadConfig, receipts } from '@devlab.group/agent-commerce';
            const loaded = await loadConfig({ path: 'config.yaml' });
            const config = { ...loaded, protocols: { ...loaded.protocols, mcp: { ...loaded.protocols.mcp, enabled: false } } };
            const gateway = await createGateway({
              config,
              store: receipts({ path: ':memory:' }),
              paymentProviders: [],
              protocolAdapters: [],
            });
            const { url } = await gateway.listen();
            const health = await fetch(url + '/health');
            if (!health.ok) throw new Error('GET /health -> ' + health.status);
            await gateway.close();
            console.log('bare install ok: gateway composed, served and closed');
          "

      - name: Install package with optional peers
        run: |
          cd "$RUNNER_TEMP/bare"
          npm install @modelcontextprotocol/server@2.3.0 @x402/core@2.25.0 @x402/evm@2.25.0 viem@2.57.1
          node --input-type=module -e "
            import { createGateway, loadConfig, receipts, CommerceError } from '@devlab.group/agent-commerce';
            import { mcp } from '@devlab.group/agent-commerce/mcp';
            import { x402 } from '@devlab.group/agent-commerce/x402';
            const config = await loadConfig({ path: 'config.yaml' });
            const gateway = await createGateway({
              config,
              store: receipts({ path: ':memory:' }),
              paymentProviders: [],
              protocolAdapters: [mcp({ mountPath: config.protocols.mcp.mountPath })],
            });
            const { url } = await gateway.listen();
            const tools = await fetch(url + config.protocols.mcp.mountPath, {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json, text/event-stream' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/list', params: {} }),
            });
            if (!tools.ok) throw new Error('tools/list -> ' + tools.status);
            await gateway.close();
            // Subpaths must share CommerceError with the main entry; separate
            // bundled copies would fail the instanceof check.
            let caught;
            try { x402({ asset: 'nope', payTo: '0x0', network: 'eip155:84532' }); } catch (e) { caught = e; }
            if (!(caught instanceof CommerceError)) throw new Error('CommerceError identity broken across subpaths');
            console.log('subpath install ok: mcp + x402 compose with the main entry');
          "

  build:
    name: Build and quickstart test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Run the README quickstart without installing Foundry on the runner.
      # Docker starts the local chain; chain-deploy uses the committed MockUSDC
      # artifact. `doctor` and the demo agent check the running stack.
      - name: Run README quickstart
        run: |
          # Match the runner's UID/GID so chain-deploy can write the host-mounted
          # .deploy/local.json manifest
          export DOCKER_UID="$(id -u)" DOCKER_GID="$(id -g)"
          docker compose up -d --build
          npm run agent-commerce -- doctor --config config-demo.yaml
          npm run demo:agent
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
