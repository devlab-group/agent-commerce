name: Release checks

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep this pin in sync with ci.yml and docker/chain.Dockerfile
  FOUNDRY_VERSION: 'v1.7.1'

jobs:
  # Run CI against the tagged commit before publishing. Its tarball install
  # checks and README quickstart are not part of `prepublishOnly`.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  audit:
    name: Dependency audit review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Save audit results for review. Assess and document high or critical
      # findings before release; a transitive advisory may not apply here.
      - run: npm audit --audit-level high || true
      - run: npm audit --json > audit.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: audit.json

  publish:
    name: Publish to npm
    # A manual dispatch on a branch runs the checks but does not publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This permission lets npm request a short-lived OIDC token for trusted
      # publishing. Configure the publisher for this repository and
      # release.yml on npmjs.com; update that setting if the file is renamed.
      # Do not add a long-lived NPM_TOKEN.
      id-token: write
    steps:
      # This job can request OIDC tokens. Pin actions to commit SHAs so their
      # code cannot change without a workflow edit; comments show versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # `prepublishOnly` runs `npm run verify`, including local-chain tests that
      # start Anvil and require Foundry.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Trusted publishing needs npm >= 11.5.1. Pin the npm version used to
      # request the OIDC token and upload the tarball.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Publish
        run: npm publish --tag latest
