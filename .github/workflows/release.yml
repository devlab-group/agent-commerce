name: Release checks

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep this pin in sync with ci.yml and docker/chain.Dockerfile
  FOUNDRY_VERSION: 'v1.7.1'

jobs:
  # Run CI against the tagged commit before publishing. Its tarball install
  # checks and README quickstart are not part of `prepublishOnly`.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  audit:
    name: Dependency audit review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Save audit results for review. Assess and document high or critical
      # findings before release; a transitive advisory may not apply here.
      - run: npm audit --audit-level high || true
      - run: npm audit --json > audit.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: audit.json

  publish:
    name: Publish to npm
    # A manual dispatch on a branch runs the checks but does not publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This permission lets npm request a short-lived OIDC token for trusted
      # publishing. Configure the publisher for this repository and
      # release.yml on npmjs.com; update that setting if the file is renamed.
      # Do not add a long-lived NPM_TOKEN.
      id-token: write
    steps:
      # This job can request OIDC tokens. Pin actions to commit SHAs so their
      # code cannot change without a workflow edit; comments show versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # `prepublishOnly` runs `npm run verify`, including local-chain tests that
      # start Anvil and require Foundry.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Trusted publishing needs npm >= 11.5.1. Pin the npm version used to
      # request the OIDC token and upload the tarball.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Publish
        run: npm publish --tag latest

  image:
    name: Publish the gateway image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push ghcr.io/devlab-group/agent-commerce with the workflow token
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # deploy/image installs the package from npm, which can take a moment to
      # serve a new version. tests/unit/deploy keeps the Dockerfile's version
      # equal to package.json
      - name: Wait for the package on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
          for _ in $(seq 30); do
            npm view "@devlab.group/agent-commerce@$version" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "@devlab.group/agent-commerce@$version is not on npm after 5 minutes" >&2
          exit 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Run the same offline check as CI on amd64 before pushing
      # The multi-platform build reuses this cache, including the generated lockfile
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/image
          platforms: linux/amd64
          load: true
          tags: agent-commerce:check
      - name: Serve the starter configuration offline
        run: bash deploy/image/check.sh agent-commerce:check
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/devlab-group/agent-commerce
          tags: type=semver,pattern={{version}}
          # Templates pin exact versions. A floating `latest` would move back
          # to 2.x when a 2.x fix ships after 3.0.0
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Agent Commerce Gateway
            org.opencontainers.image.description=Self-hosted, non-custodial gateway that puts x402 payments in front of an existing HTTP API, over HTTP or MCP.
            org.opencontainers.image.url=https://acg.devlab.group
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
