# ---------------------------------------------------------------------------
# Agent Commerce Gateway - demo configuration
#
# `docker compose up` uses this file directly; the quickstart needs no copy.
#
# Most placeholders fall back to the local demo stack. X402_ASSET and
# X402_FACILITATOR_PRIVATE_KEY have no fallback; they come from the chain
# deployment manifest (.deploy/local.json):
# - in docker compose, docker/gateway-entrypoint.sh exports them;
# - `npm run agent-commerce -- validate` and `doctor` read the manifest on the
#   host after `npm run chain:deploy`;
# - a gateway started on the host needs both exported.
#
# For your own deployment, edit it or generate a new one with:
#   npm run agent-commerce -- init
#
# `${VAR}` placeholders resolve from the environment at load time. An
# unresolved one fails startup, and config errors never print a resolved value.
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: demo-store
  name: Demo Data Store
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}

server:
  port: ${GATEWAY_PORT:-8080}
  # 0.0.0.0 inside the container; docker-compose publishes to 127.0.0.1 only
  host: 0.0.0.0

  # Operator routes (/api/receipts, /api/events) expose the merchant's
  # commerce ledger. They require this token and return 404 when it is unset,
  # so a missing token never reads as "no restriction".
  adminToken: ${ADMIN_TOKEN:-local-demo-admin-token}

  # Explicit allowlist; empty means no browser may read any route. Agent
  # traffic is not browser traffic and gets no CORS headers regardless.
  allowedOrigins:
    - ${DASHBOARD_ORIGIN:-http://localhost:5173}

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp

resources:
  # --- free resource: exposes a merchant API endpoint -----------------------
  weather_basic:
    name: Basic Weather
    description: Current basic weather for a city. Free.
    input:
      type: object
      properties:
        city:
          type: string
          description: City name, e.g. "Berlin"
      required: [city]
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/api/weather/{city}
      timeoutMs: 5000
    pricing:
      type: free
    expose: [http, mcp]

  # --- paid resource: requires x402 settlement ------------------------------
  market_report:
    name: Premium Market Report
    description: Latest premium market analysis. Paid resource.
    input:
      type: object
      properties: {}
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/api/report
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01"
      currency: USDC
    expose: [http, mcp]
    payments: [x402]

payments:
  x402:
    enabled: true
    network: ${X402_NETWORK:-eip155:84532}
    rpcUrl: ${X402_RPC_URL:-http://127.0.0.1:8545}
    asset: ${X402_ASSET}
    assetName: ${X402_ASSET_NAME:-MockUSDC}
    assetVersion: ${X402_ASSET_VERSION:-2}
    assetDecimals: ${X402_ASSET_DECIMALS:-6}
    # Settlement destination. Set this to an address the merchant controls;
    # see docs/security.md.
    payTo: ${MERCHANT_WALLET:-0x70997970C51812dc3A010C7d01b50e0d17dc79C8}
    # Seconds a payment challenge stays valid
    maxTimeoutSeconds: 120
    # In-process facilitator for the local dev chain. In production use
    # `mode: remote` with the facilitator's `url` instead.
    facilitator:
      mode: local
      signerPrivateKey: ${X402_FACILITATOR_PRIVATE_KEY}
